[package]
name = "FlexTree-OnDisk"
version = "0.1.0"
edition = "2024"

[dependencies]
compio = { version = "0.19.2", features = ["macros", "fs"] }
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
