[package]
name = "FlexTree-OnDisk"
version = "0.1.0"
edition = "2024"

[dependencies]
compio = { version = "0.19.2", features = ["macros", "fs"] }
spatial-id = { git = "https://github.com/AirBee-Project/spatial-id-rs", branch = "main", default-features = false }
crc32c = "0.6"
bytemuck = { version = "1", features = ["derive", "min_const_generics", "extern_crate_alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
